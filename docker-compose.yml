services:
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - ".env"
    container_name: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/pgdata
    ports:
      - '5432:5432'
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PORT=${PORT}
    env_file:
      - ".env"
    ports:
      - '3000:3000'
    depends_on:
      - db
    volumes:
      - ./src:/app/src
    develop:
      watch:
        - action: rebuild
          path: ./src
